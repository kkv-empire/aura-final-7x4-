name: Make Video

on:
  workflow_dispatch:
    inputs:
      image_url:
        description: 'Product Image URL'
        required: true
      title:
        description: 'Product Title'
        required: true
      asin:
        description: 'Product ASIN'
        required: true

jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - name: Code lao
        uses: actions/checkout@v4

      - name: Photo download karo
        run: |
          curl -L "${{ github.event.inputs.image_url }}" -o photo.jpg
          ls -lh photo.jpg

      - name: 3 Platform ke Video banao
        run: |
          if [ -f "assets/music.mp3" ]; then
            echo "Music mil gaya - Music ke saath banega"
            ffmpeg -y -loop 1 -i photo.jpg -i assets/music.mp3 -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:color=black" -t 7 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac telegram.mp4
            ffmpeg -y -loop 1 -i photo.jpg -i assets/music.mp3 -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black" -t 7 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac instagram.mp4
            ffmpeg -y -loop 1 -i photo.jpg -i assets/music.mp3 -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black" -t 10 -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac youtube.mp4
          else
            echo "Music nahi mila - Bina music ke banega"
            ffmpeg -y -loop 1 -i photo.jpg -vf "scale=720:1280:force_original_aspect_ratio=decrease,pad=720:1280:(ow-iw)/2:(oh-ih)/2:color=black" -t 7 -c:v libx264 -pix_fmt yuv420p telegram.mp4
            ffmpeg -y -loop 1 -i photo.jpg -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black" -t 7 -c:v libx264 -pix_fmt yuv420p instagram.mp4
            ffmpeg -y -loop 1 -i photo.jpg -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=black" -t 10 -c:v libx264 -pix_fmt yuv420p youtube.mp4
          fi
          ls -lh *.mp4

      - name: 3 Video save karo
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ github.event.inputs.asin }}
          path: |
            telegram.mp4
            instagram.mp4
            youtube.mp4
          retention-days: 1
