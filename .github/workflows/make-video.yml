name: Make Video
on:
  workflow_dispatch:
    inputs:
      image_url: { description: "Image URL", required: true, type: string }
      title: { description: "Title", required: true, type: string }
      asin: { description: "ASIN", required: true, type: string }
      niche: { description: "Niche", required: true, type: string }
      caption: { description: "Caption", required: true, type: string }
      ig_id: { description: "IG ID", required: false, type: string }
      ig_token: { description: "IG Token", required: false, type: string }
      fb_id: { description: "FB Page ID", required: false, type: string }
      fb_token: { description: "FB Page Token", required: false, type: string }
      price: { description: "Price Text", required: false, type: string }
jobs:
  make:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + Python Lib
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q google-api-python-client google-auth-oauthlib google-auth-httplib2 requests
      - name: Download Real Image - GH se - 4 Rasta
        run: |
          ASIN="${{ inputs.asin }}"
          IMG_URL="${{ inputs.image_url }}"
          echo "ASIN=$ASIN IMG_URL=$IMG_URL"
          rm -f product.jpg amz.html jina.txt
          # Rasta 1 - Agar Vercel se Asli Photo hi aayi hai to wahi lo
          if echo "$IMG_URL" | grep -q "media-\|images/I/"; then
            curl -sL -A "Mozilla/5.0" "$IMG_URL" -o product.jpg || true
            echo "RASTA 1 SIZE: $(stat -c%s product.jpg 2>/dev/null || echo 0)"
          fi
          # Rasta 2 - GH se HTML se Asli Photo nikalo - GH IP Block nahi hota
          if [ ! -s product.jpg ] || [ $(stat -c%s product.jpg 2>/dev/null || echo 0) -lt 5000 ]; then
            rm -f product.jpg
            curl -sL -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" -H "Accept-Language: en-US,en;q=0.9" "https://www.amazon.in/dp/$ASIN" -o amz.html || true
            PYIMG=$(python3 -c "
          import re
          try:
            t=open('amz.html',errors='ignore').read()
            m=re.findall(r'https://m\.media-amazon\.com/images/I/[A-Za-z0-9._\-+%]+?\.jpg',t)
            m=[x for x in m if '_SL' not in x and '_SX' not in x and '_SS' not in x and 'play-icon' not in x]
            print(m[0] if m else '')
          except: print('')
          " || true)
            echo "RASTA 2 IMG=$PYIMG"
            if [ -n "$PYIMG" ]; then curl -sL -A "Mozilla/5.0" "$PYIMG" -o product.jpg || true; fi
            echo "RASTA 2 SIZE: $(stat -c%s product.jpg 2>/dev/null || echo 0)"
          fi
          # Rasta 3 - Jina Server se - Telegram jaisa Server
          if [ ! -s product.jpg ] || [ $(stat -c%s product.jpg 2>/dev/null || echo 0) -lt 5000 ]; then
            rm -f product.jpg
            curl -sL "https://r.jina.ai/https://www.amazon.in/dp/$ASIN" -o jina.txt || true
            JIMG=$(grep -oE "https://m\.media-amazon\.com/images/I/[A-Za-z0-9._%+-]+\.jpg" jina.txt | grep -v "_SL" | grep -v "_SX" | head -n 1 || true)
            echo "RASTA 3 IMG=$JIMG"
            if [ -n "$JIMG" ]; then curl -sL -A "Mozilla/5.0" "$JIMG" -o product.jpg || true; fi
            echo "RASTA 3 SIZE: $(stat -c%s product.jpg 2>/dev/null || echo 0)"
          fi
          # Rasta 4 - Microlink OG Image - Last Rasta
          if [ ! -s product.jpg ] || [ $(stat -c%s product.jpg 2>/dev/null || echo 0) -lt 5000 ]; then
            rm -f product.jpg
            OG=$(curl -sL "https://api.microlink.io/?url=https://www.amazon.in/dp/$ASIN&meta=false&embed=image.url" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('data',{}).get('image',{}).get('url',''))" || true)
            echo "RASTA 4 IMG=$OG"
            if [ -n "$OG" ]; then curl -sL -A "Mozilla/5.0" "$OG" -o product.jpg || true; fi
          fi
          ls -lh product.jpg || echo "NO IMAGE - Title wali Video banegi"
          file product.jpg || true
      - name: Make CLEAR Premium Video
        env:
          TITLE: ${{ inputs.title }}
          PRICE: ${{ inputs.price }}
        run: |
          TITLE_SHORT=$(echo "$TITLE" | cut -c1-60)
          echo "$TITLE_SHORT" > title.txt
          echo "$PRICE" > price.txt
          if [ -s product.jpg ]; then
            ffmpeg -y -loop 1 -i product.jpg -f lavfi -i anullsrc=r=44100:cl=stereo -t 15 -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=white,drawbox=x=0:y=0:w=1080:h=180:color=black@0.65:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=title.txt:fontsize=38:fontcolor=white:x=(w-text_w)/2:y=30:line_spacing=8,drawbox=x=0:y=1740:w=1080:h=180:color=black@0.75:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=price.txt:fontsize=48:fontcolor=yellow:x=(w-text_w)/2:y=1760,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SHOP NOW - Link in Bio':fontsize=32:fontcolor=white:x=(w-text_w)/2:y=1830,fade=t=in:st=0:d=0.5,fade=t=out:st=14.5:d=0.5,format=yuv420p[v]" -map "[v]" -map 1:a -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest video.mp4
          else
            ffmpeg -y -f lavfi -i color=c=0x111111:s=1080x1920:d=15 -f lavfi -i anullsrc=r=44100:cl=stereo -t 15 -filter_complex "[0:v]drawbox=x=0:y=0:w=1080:h=180:color=black@0.65:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=title.txt:fontsize=38:fontcolor=white:x=(w-text_w)/2:y=30:line_spacing=8,drawbox=x=0:y=1740:w=1080:h=180:color=black@0.75:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=price.txt:fontsize=48:fontcolor=yellow:x=(w-text_w)/2:y=1760,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SHOP NOW - Link in Bio':fontsize=32:fontcolor=white:x=(w-text_w)/2:y=1830,format=yuv420p[v]" -map "[v]" -map 1:a -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest video.mp4
          fi
          ls -lh video.mp4
      - name: Upload YT Shorts + Insta Reels + FB Reels - FINAL - Release Link
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_JSON: ${{ secrets.YT_REFRESH_JSON }}
          YT_JSON: ${{ secrets.YT_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_AIVENDORA: ${{ secrets.YT_AIVENDORA }}
          YT_TRENDMIND: ${{ secrets.YT_TRENDMIND }}
          YT_NICHEPILOT: ${{ secrets.YT_NICHEPILOT }}
          YT_ADBRAINX: ${{ secrets.YT_ADBRAINX }}
          YT_SMARTSHIPLY: ${{ secrets.YT_SMARTSHIPLY }}
          YT_CARTFLOW: ${{ secrets.YT_CARTFLOW }}
          YT_GLOBALDROP: ${{ secrets.YT_GLOBALDROP }}
          IG_ID: ${{ inputs.ig_id }}
          IG_TOKEN: ${{ inputs.ig_token }}
          FB_ID: ${{ inputs.fb_id }}
          FB_TOKEN: ${{ inputs.fb_token }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESC: ${{ inputs.caption }}
          NICHE: ${{ inputs.niche }}
          ASIN: ${{ inputs.asin }}
        run: |
          python3 - << 'PY'
          import os, time, re, requests
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials
          niche = os.environ.get('NICHE','').lower()
          asin = os.environ.get('ASIN','')
          desc = os.environ.get('VIDEO_DESC','')
          title = os.environ.get('VIDEO_TITLE','')[:100]
          A = "Am" + "azon"
          token = ""
          if os.environ.get('YT_REFRESH_TOKEN'): token = os.environ['YT_REFRESH_TOKEN'].strip()
          if not token:
            for k, v in os.environ.items():
              if k.upper() == ("YT_" + niche.upper()):
                token = (v or "").strip()
                if token: print("YT TOKEN FOUND in", k); break
          if not token:
            for k in ['YT_REFRESH_JSON','YT_JSON']:
              j = os.environ.get(k,'')
              if not j: continue
              mm = re.search(r'"refresh_token"\s*:\s*"([^"]+)"', j)
              if mm: token = mm.group(1); break
          print("YT TOKEN:", "YES" if token else "NO")
          if token:
            try:
              creds = Credentials(None, refresh_token=token, token_uri='https://oauth2.googleapis.com/token', client_id=os.environ['YT_CLIENT_ID'], client_secret=os.environ['YT_CLIENT_SECRET'])
              yt = build('youtube','v3', credentials=creds)
              yt_desc = "#ad | As an " + A + " Associate I earn from qualifying purchases.\n" + desc + "\n\nLink ko Copy karke Browser me kholo - Bio me bhi Link hai"
              req = yt.videos().insert(part='snippet,status', body={'snippet':{'title':title,'description':yt_desc,'categoryId':'27'},'status':{'privacyStatus':'public','madeForKids':False}}, media_body=MediaFileUpload('video.mp4', chunksize=-1, resumable=True))
              res = req.execute()
              print("YT SHORTS OK", res['id'])
            except Exception as e:
              print("YT UPLOAD FAIL", str(e)[:500])
          try:
            ig_id = os.environ.get('IG_ID','')
            ig_token = os.environ.get('IG_TOKEN','')
            fb_id = os.environ.get('FB_ID','')
            fb_token = os.environ.get('FB_TOKEN','')
            repo = os.environ.get('GITHUB_REPOSITORY','')
            gh_tok = os.environ.get('GH_TOKEN','')
            print("IG ID FOUND:", "YES" if ig_id else "NO", "FB ID FOUND:", "YES" if fb_id else "NO")
            pub_url = ""
            if (ig_id or fb_id) and repo and gh_tok:
              tag = f"reel-{asin}-{int(time.time())}"
              G = "git" + "hub"
              r = requests.post("https://api." + G + ".com/repos/" + repo + "/releases", headers={"Authorization": f"Bearer {gh_tok}", "Accept": "application/vnd." + G + "+json"}, json={"tag_name": tag, "name": tag, "draft": False, "prerelease": False}, timeout=30).json()
              rel_id = r.get('id')
              print("GH RELEASE:", rel_id)
              if rel_id:
                up_url = "https://uploads." + G + ".com/repos/" + repo + "/releases/" + str(rel_id) + "/assets?name=video.mp4"
                with open('video.mp4','rb') as f:
                  up = requests.post(up_url, headers={"Authorization": f"Bearer {gh_tok}", "Content-Type": "video/mp4"}, data=f, timeout=120).json()
                if up.get('browser_download_url'):
                  pub_url = up['browser_download_url']
                  print("GITHUB VIDEO URL OK", pub_url[:100])
              print("PUBLIC VIDEO URL:", pub_url[:100] if pub_url else "NONE")
              if pub_url.startswith('http') and ig_id and ig_token:
                ig_caption = "#ad | As an " + A + " Associate I earn from qualifying purchases.\n" + desc + "\nLink in Bio - Telegram pe saare Products dekho"
                cr = requests.post(f"https://graph.facebook.com/v21.0/{ig_id}/media", json={"media_type":"REELS","video_url":pub_url,"caption":ig_caption,"access_token":ig_token}, timeout=30).json()
                print("IG REELS CONTAINER:", str(cr)[:500])
                if 'id' in cr:
                  cid = cr['id']
                  finished = False
                  for i in range(30):
                    time.sleep(10)
                    st = requests.get(f"https://graph.facebook.com/v21.0/{cid}?fields=status_code,status&access_token={ig_token}", timeout=30).json()
                    print("IG STATUS:", st)
                    if st.get('status_code')=='FINISHED':
                      finished = True
                      break
                    if st.get('status_code')=='ERROR':
                      print("IG ERROR:", st); break
                  if finished:
                    pub = requests.post(f"https://graph.facebook.com/v21.0/{ig_id}/media_publish", json={"creation_id":cid,"access_token":ig_token}, timeout=30).json()
                    print("IG REELS PUBLISHED:", pub)
                  else:
                    print("IG REELS FAIL - FINISHED nahi hua")
                else:
                  print("IG REELS FAIL - Container nahi bana:", str(cr)[:500])
              # FB FIX - Reels API - 3 Step - /videos wala Purana Code Hata Diya
              if fb_id and fb_token:
                try:
                  fb_caption = "#ad | As an " + A + " Associate I earn from qualifying purchases.\n" + desc + "\nLink pe Click karo - Direct " + A + " khulega"
                  st1 = requests.post(f"https://graph.facebook.com/v21.0/{fb_id}/video_reels", json={"upload_phase":"start","access_token":fb_token}, timeout=30).json()
                  print("FB REELS START:", str(st1)[:500])
                  vid_id = st1.get("video_id")
                  up_url2 = st1.get("upload_url")
                  if vid_id and up_url2:
                    with open('video.mp4','rb') as vf:
                      tr = requests.post(up_url2, headers={"Authorization": f"OAuth {fb_token}"}, data=vf, timeout=120)
                    print("FB REELS TRANSFER:", tr.status_code, str(tr.text)[:500])
                    fin = requests.post(f"https://graph.facebook.com/v21.0/{fb_id}/video_reels", json={"upload_phase":"finish","video_id":vid_id,"description":fb_caption,"access_token":fb_token}, timeout=30).json()
                    print("FB REELS POSTED:", str(fin)[:500])
                  else:
                    print("FB REELS FAIL - Start nahi hua")
                except Exception as e:
                  print("FB REELS FAIL", str(e)[:500])
          except Exception as e:
            print("IG/FB REELS FAIL", str(e)[:500])
          PY
