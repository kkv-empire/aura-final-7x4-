name: Make Video
on:
  workflow_dispatch:
    inputs:
      image_url: { description: "Image URL", required: true, type: string }
      title: { description: "Title", required: true, type: string }
      asin: { description: "ASIN", required: true, type: string }
      niche: { description: "Niche", required: true, type: string }
      caption: { description: "Caption", required: true, type: string }
      ig_id: { description: "【entity-IG¦canonical_name=IG】 ID", required: false, type: string }
      ig_token: { description: "【entity-IG¦canonical_name=IG】 Token", required: false, type: string }
      price: { description: "Price Text", required: false, type: string }
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ffmpeg + Python Lib
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core > /dev/null
          pip install -q google-api-python-client google-auth-oauthlib google-auth-httplib2 requests
      - name: Download Real Image - HIGH RES
        run: |
          curl -L "${{ inputs.image_url }}" -o product.jpg
          ls -lh product.jpg
      - name: Make CLEAR Premium Video - No Blur No Zoom
        env:
          TITLE: ${{ inputs.title }}
          PRICE: ${{ inputs.price }}
        run: |
          TITLE_SHORT=$(echo "$TITLE" | cut -c1-60)
          echo "$TITLE_SHORT" > title.txt
          echo "$PRICE" > price.txt
          cat title.txt
          cat price.txt
          ffmpeg -y -loop 1 -i product.jpg -f lavfi -i anullsrc=r=44100:cl=stereo -t 15 -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2:color=white,drawbox=x=0:y=0:w=1080:h=180:color=black@0.65:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=title.txt:fontsize=38:fontcolor=white:x=(w-text_w)/2:y=30:line_spacing=8,drawbox=x=0:y=1740:w=1080:h=180:color=black@0.75:t=fill,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:textfile=price.txt:fontsize=48:fontcolor=yellow:x=(w-text_w)/2:y=1760,drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf:text='SHOP NOW - Link in Comment / Bio':fontsize=32:fontcolor=white:x=(w-text_w)/2:y=1830,fade=t=in:st=0:d=0.5,fade=t=out:st=14.5:d=0.5,format=yuv420p[v]" -map "[v]" -map 1:a -c:v libx264 -crf 18 -preset veryfast -pix_fmt yuv420p -c:a aac -shortest video.mp4
          ls -lh video.mp4
      - name: Upload YT Shorts + Comment Clickable Link + Insta Reels Direct
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_JSON: ${{ secrets.YT_REFRESH_JSON }}
          YT_JSON: ${{ secrets.YT_JSON }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_AIVENDORA: ${{ secrets.YT_AIVENDORA }}
          YT_TRENDMIND: ${{ secrets.YT_TRENDMIND }}
          YT_NICHEPILOT: ${{ secrets.YT_NICHEPILOT }}
          YT_ADBRAINX: ${{ secrets.YT_ADBRAINX }}
          YT_SMARTSHIPLY: ${{ secrets.YT_SMARTSHIPLY }}
          YT_CARTFLOW: ${{ secrets.YT_CARTFLOW }}
          YT_GLOBALDROP: ${{ secrets.YT_GLOBALDROP }}
          IG_ID: ${{ inputs.ig_id }}
          IG_TOKEN: ${{ inputs.ig_token }}
          VIDEO_TITLE: ${{ inputs.title }}
          VIDEO_DESC: ${{ inputs.caption }}
          NICHE: ${{ inputs.niche }}
          IMAGE_URL: ${{ inputs.image_url }}
        run: |
          python3 - << 'PY'
          import os, json, time, re, requests
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          from google.oauth2.credentials import Credentials
          niche = os.environ.get('NICHE','').lower()
          desc = os.environ.get('VIDEO_DESC','')
          title = os.environ.get('VIDEO_TITLE','')[:100]
          m = re.search(r'https://\S+', desc)
          link = m.group(0) if m else ""
          print("LINK:", link[:80] if link else "NO LINK")
          # FIX 1 - YT TOKEN - Niche se Match mat karo - JSON me kahi bhi refresh_token ho, le lo
          token = ""
          if os.environ.get('YT_REFRESH_TOKEN'): token = os.environ['YT_REFRESH_TOKEN'].strip()
          if not token:
            for k, v in os.environ.items():
              if k.upper() == ("YT_" + niche.upper()):
                token = (v or "").strip()
                if token: print("YT TOKEN FOUND in", k); break
          if not token:
            for k in ['YT_REFRESH_JSON','YT_JSON']:
              j = os.environ.get(k,'')
              if not j: continue
              mm = re.search(r'"refresh_token"\s*:\s*"([^"]+)"', j)
              if mm:
                token = mm.group(1)
                print("YT TOKEN FOUND in", k, "len=", len(token))
                break
          if not token:
            for k in ['YT_REFRESH_JSON','YT_JSON']:
              j = (os.environ.get(k,'') or "").strip()
              if j and j.startswith("1//") and len(j) > 20:
                token = j
                break
          print("YT TOKEN:", "YES len="+str(len(token)) if token else "NO")
          print("YT NICHE:", niche, "| YT CLIENT_ID:", "YES" if os.environ.get('YT_CLIENT_ID') else "NO")
          yt_id = ""
          if token:
            try:
              creds = Credentials(None, refresh_token=token, token_uri='https://oauth2.googleapis.com/token', client_id=os.environ['YT_CLIENT_ID'], client_secret=os.environ['YT_CLIENT_SECRET'])
              yt = build('youtube','v3', credentials=creds)
              req = yt.videos().insert(part='snippet,status', body={'snippet':{'title':title,'description':desc,'categoryId':'27'},'status':{'privacyStatus':'public','madeForKids':False}}, media_body=MediaFileUpload('video.mp4', chunksize=-1, resumable=True))
              res = req.execute()
              yt_id = res['id']
              print("YT SHORTS OK", yt_id)
              if link:
                try:
                  c = yt.commentThreads().insert(part='snippet', body={'snippet':{'videoId':yt_id,'topLevelComment':{'snippet':{'textOriginal':'👉 Buy Link: ' + link + '\n#ad | As an 【entity-Amazon¦canonical_name=Amazon】 Associate I earn from qualifying purchases.'}}}}).execute()
                  print("YT COMMENT OK - Link Clickable", c['id'])
                except Exception as e:
                  print("YT COMMENT FAIL - Channel me Comments OFF / Held for Review hai - YouTube Studio > Settings > Community > Comments OFF karo", str(e)[:300])
            except Exception as e:
              print("YT UPLOAD FAIL", str(e)[:500])
          else:
            print("YT SKIPPED - Token nahi mila")
          # FIX 2 - INSTA REELS - PUT + Offset + 5 Min Wait - FINISHED ke baad hi Publish
          try:
            ig_id = os.environ.get('IG_ID','')
            ig_token = os.environ.get('IG_TOKEN','')
            print("【entity-IG¦canonical_name=IG】 ID FOUND:", "YES" if ig_id else "NO")
            if ig_id and ig_token:
              size = os.path.getsize('video.mp4')
              print("VIDEO SIZE:", size)
              cr = requests.post(f"https://graph.facebook.com/v21.0/{ig_id}/media", data={"upload_type":"resumable","media_type":"REELS","access_token":ig_token}, timeout=30).json()
              print("【entity-IG¦canonical_name=IG】 UPLOAD START:", str(cr)[:500])
              upload_uri = cr.get('uri') or cr.get('upload_uri') or ""
              container_id = cr.get('id','')
              if upload_uri and container_id:
                with open('video.mp4','rb') as f:
                  r2 = requests.put(upload_uri, headers={"Authorization":f"OAuth {ig_token}","Content-Type":"video/mp4","Offset":"0","file_size":str(size)}, data=f, timeout=180)
                print("IG VIDEO UPLOAD:", r2.status_code, r2.text[:300])
                finished = False
                for i in range(30):
                  time.sleep(10)
                  st = requests.get(f"https://graph.facebook.com/v21.0/{container_id}?fields=status_code,status&access_token={ig_token}", timeout=30).json()
                  print("【entity-IG¦canonical_name=IG】 STATUS:", st)
                  if st.get('status_code')=='FINISHED':
                    finished = True
                    break
                  if st.get('status_code')=='ERROR':
                    print("IG ERROR - Video Process nahi hua")
                    break
                if finished:
                  ig_caption = desc + "\n🔗 Link in Bio - Telegram pe saare Products dekho"
                  pub = requests.post(f"https://graph.facebook.com/v21.0/{ig_id}/media_publish", json={"creation_id":container_id,"access_token":ig_token}, timeout=30).json()
                  print("IG REELS PUBLISHED:", pub)
                else:
                  print("IG REELS FAIL - Video FINISHED nahi hua - 5 Min Wait kiya")
              else:
                print("IG REELS FAIL - Upload URI nahi mila - Token Expire ho sakta hai")
          except Exception as e:
            print("IG REELS FAIL", str(e)[:500])
          PY
