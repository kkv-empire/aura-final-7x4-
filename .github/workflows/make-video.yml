name: Make Video + YT Upload
on:
  workflow_dispatch:
    inputs:
      image_url: { required: true, type: string }
      title: { required: true, type: string }
      asin: { required: true, type: string }
      niche: { required: false, type: string, default: "aivendora" }
      caption: { required: false, type: string, default: "" }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make Video from Photo
        run: |
          curl -L "${{ inputs.image_url }}" -o photo.jpg
          ffmpeg -y -loop 1 -i photo.jpg -t 6 -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2" -pix_fmt yuv420p video.mp4
      - name: Upload to YouTube
        env:
          YT_REFRESH: ${{ secrets[format('YT_{0}', inputs.niche)] }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          node -e "
          const fs=require('fs');
          (async()=>{
            const {uploadVideoToYT}=require('./lib/youtube.js');
            // Env ko Vercel jaisa banao
            process.env['YT_'+process.argv[1].toUpperCase()]=process.env.YT_REFRESH;
            process.env.YT_CLIENT_ID=process.env.YT_CLIENT_ID;
            process.env.YT_CLIENT_SECRET=process.env.YT_CLIENT_SECRET;
            const buf=fs.readFileSync('video.mp4');
            const id=await uploadVideoToYT({niche:process.argv[1], title:process.argv[2], description:process.argv[3], videoBuffer:buf});
            console.log('YT UPLOADED:'+id);
          })();
          " "${{ inputs.niche }}" "${{ inputs.title }}" "${{ inputs.caption }}"
