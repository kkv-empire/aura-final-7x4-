name: Make Video
on:
  workflow_dispatch:
    inputs:
      image_url: { description: "Image URL", required: true, type: string }
      title: { description: "Title", required: true, type: string }
      asin: { description: "ASIN", required: true, type: string }
      niche: { description: "Niche", required: true, type: string }
      caption: { description: "Caption with Buy Link", required: true, type: string }
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download Image
        run: curl -L "${{ inputs.image_url }}" -o product.jpg
      - name: Make Short Video with Free Music
        run: |
          ffmpeg -loop 1 -i product.jpg -f lavfi -i anullsrc=r=44100:cl=stereo -t 15 -vf "scale=1080:1920:force_original_aspect_ratio=decrease,pad=1080:1920:(ow-iw)/2:(oh-ih)/2,zoompan=z='min(zoom+0.0015,1.3)':d=375:s=1080x1920" -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest video.mp4
      - name: Upload to YouTube Shorts - Description me Clickable Link
        uses: actions/upload-youtube-video@v1
        with:
          title: ${{ inputs.title }}
          description: ${{ inputs.caption }}
          video-file: video.mp4
          privacy: public
          shorts: true
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
